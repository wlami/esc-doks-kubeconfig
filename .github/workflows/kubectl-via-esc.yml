# CI with zero stored secrets:
#   GitHub OIDC -> short-lived Pulumi token -> ESC vends DO token + kubeconfig.
# No DIGITALOCEAN_ACCESS_TOKEN in repo secrets. No kubeconfig in the repo.
name: kubectl via ESC

on:
  workflow_dispatch:

permissions:
  id-token: write   # required to mint the GitHub OIDC token
  contents: read

jobs:
  kubectl:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange GitHub OIDC token for a Pulumi access token
        uses: pulumi/auth-actions@v1
        with:
          organization: ${{ vars.PULUMI_ORG }}
          requested-token-type: urn:pulumi:token-type:access_token:organization

      - name: Install doctl (no token: ESC supplies it at run time)
        run: |
          curl -sL https://github.com/digitalocean/doctl/releases/download/v1.168.0/doctl-1.168.0-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin doctl

      - name: Load ESC environment
        uses: pulumi/esc-action@v3
        with:
          environment: esc-doks-demo/doks-dev

      - name: Talk to the cluster
        run: kubectl get nodes -o wide
